<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000">
<title>Rastreamento Palio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; font-family: system-ui, -apple-system, sans-serif;
    background: #0a0a0a; color: #fff; overflow: hidden;
  }
  #map { position: fixed; inset: 0; z-index: 1; }

  /* ===== TOPBAR - Botões PALIO 1 e PALIO 2 ===== */
  #topbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 999; display: flex; gap: 8px;
  }
  .car-btn {
    background: #00000099; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid #ffffff26; border-radius: 14px;
    padding: 11px 18px; color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 9px;
    transition: all 0.2s; letter-spacing: 0.3px;
  }
  .car-btn:hover { background: #000000cc; }
  .car-btn.active {
    border-color: #ffffff66; background: #000000d9;
    box-shadow: 0 4px 20px #00000055;
  }
  .car-btn .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #555;
    flex-shrink: 0; transition: all 0.3s;
  }
  .car-btn .dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .car-btn .dot.semconexao {
    background: #f59e0b; box-shadow: 0 0 8px #f59e0b;
    animation: dotPulse 1.5s ease-in-out infinite;
  }
  .car-btn .dot.offline { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  /* ===== CARD INFERIOR ===== */
  #card {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 999; width: min(440px, 92vw);
    background: #000000b3; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid #ffffff26; border-radius: 22px;
    padding: 18px 20px;
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 8px 32px #00000088;
  }

  /* Linha do status grande */
  .status-row {
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .car-label {
    font-size: 10px; opacity: 0.55; text-transform: uppercase;
    letter-spacing: 1.5px; margin-bottom: 4px;
  }
  #status-big {
    font-size: 24px; font-weight: 800; letter-spacing: 0.5px; line-height: 1;
  }
  #status-big.online { color: #22c55e; }
  #status-big.semconexao { color: #f59e0b; }
  #status-big.offline { color: #ef4444; }
  #status-sub {
    font-size: 11px; opacity: 0.6; text-align: right; line-height: 1.4;
    max-width: 130px;
  }

  /* Linha dos ícones */
  .icons-row {
    display: flex; justify-content: space-around;
    padding: 14px 0;
    border-top: 1px solid #ffffff14; border-bottom: 1px solid #ffffff14;
  }
  .icon-block {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 70px;
  }
  .icon-block .ico {
    width: 22px; height: 22px; opacity: 0.85;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-block .ico svg { width: 100%; height: 100%; }
  .icon-block .val { font-weight: 700; font-size: 14px; color: #fff; }
  .icon-block .lbl { font-size: 9px; opacity: 0.55; text-transform: uppercase; letter-spacing: 0.8px; }

  /* Botão de ação */
  #action-btn {
    background: #ffffff1a; color: #fff; border: 1px solid #ffffff14;
    padding: 13px; border-radius: 12px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    letter-spacing: 0.3px;
  }
  #action-btn:hover { background: #ffffff26; transform: translateY(-1px); }
  #action-btn:active { transform: translateY(0); }
  #action-btn.online { background: #22c55e22; color: #4ade80; border-color: #22c55e44; }
  #action-btn.semconexao { background: #f59e0b22; color: #fbbf24; border-color: #f59e0b44; }
  #action-btn.offline { background: #ef444422; color: #f87171; border-color: #ef444444; }

  /* ===== LEAFLET CUSTOMIZADO ===== */
  .leaflet-control-zoom a {
    background: #00000080 !important; color: #fff !important;
    border: 1px solid #ffffff26 !important; backdrop-filter: blur(10px);
  }
  .leaflet-control-zoom a:hover { background: #000000cc !important; }
  .leaflet-control-layers {
    background: #00000080 !important; backdrop-filter: blur(10px);
    border-radius: 14px !important; border: 1px solid #ffffff26 !important;
    color: #fff; font-size: 12px;
  }
  .leaflet-control-attribution {
    background: #00000080 !important; color: #aaa !important;
    backdrop-filter: blur(10px); font-size: 9px;
  }
  .leaflet-control-attribution a { color: #ccc !important; }

  /* ===== PINOS DO MAPA ===== */
  .car-pin {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 2px 10px #000a;
    position: relative;
  }
  .car-pin.online { background: #3b82f6; }
  .car-pin.semconexao { background: #3b82f6; }
  .car-pin.offline { background: #666; }
  /* Círculo pulsante para SEM_CONEXAO */
  .car-pin.semconexao::before {
    content: ''; position: absolute; inset: -8px;
    border-radius: 50%; border: 3px solid #f59e0b;
    animation: pinPulse 1.5s ease-out infinite;
  }
  .car-pin.semconexao::after {
    content: ''; position: absolute; inset: -8px;
    border-radius: 50%; border: 2px solid #f59e0b;
    animation: pinPulse 1.5s ease-out 0.5s infinite;
  }
  @keyframes pinPulse {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(2.5); }
  }

  /* Label flutuante acima do pino */
  .car-label-pin {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    margin-bottom: 6px; white-space: nowrap;
    background: #000000cc; color: #fff; padding: 3px 8px; border-radius: 6px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
    border: 1px solid #ffffff26;
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <button class="car-btn active" id="btn-palio1" onclick="selectCar('PALIO1')">
    <span class="dot offline" id="dot-PALIO1"></span>
    <span>PALIO 1</span>
  </button>
  <button class="car-btn" id="btn-palio2" onclick="selectCar('PALIO2')">
    <span class="dot offline" id="dot-PALIO2"></span>
    <span>PALIO 2</span>
  </button>
</div>

<div id="card">
  <div class="status-row">
    <div>
      <div class="car-label" id="car-label">PALIO 1</div>
      <div id="status-big" class="offline">OFFLINE</div>
    </div>
    <div id="status-sub">Sem conexao</div>
  </div>

  <div class="icons-row">
    <div class="icon-block">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h2V16H2v6zm5 0h2V10H7v12zm5 0h2V6h-2v16zm5 0h2V2h-2v20z"/></svg>
      </div>
      <span class="val" id="signal-val">0/4</span>
      <span class="lbl">Sinal</span>
    </div>
    <div class="icon-block">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
      <span class="val" id="battery-val">--%</span>
      <span class="lbl">Bateria</span>
    </div>
    <div class="icon-block">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm-.5-13H10v6l5.2 3.1.8-1.3-4.5-2.7V7z"/></svg>
      </div>
      <span class="val" id="updated-val">--</span>
      <span class="lbl">Atualizado</span>
    </div>
  </div>

  <button id="action-btn" class="offline" onclick="goToCar()">
    <span>📍</span> <span id="action-btn-text">VER ÚLTIMO LOCAL</span>
  </button>
</div>

<script>
// ===== CONFIG =====
const U = "https://jpaflbkafupwqfqfcjrv.supabase.co";
const K = "sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";

const CARS = {
  PALIO1: { device_id: "LG",   label: "PALIO 1" },
  PALIO2: { device_id: "LG2",  label: "PALIO 2" }
};

let currentCar = "PALIO1";
const carsData = {
  PALIO1: { lat: -20.3881, lng: -43.7569, lastUpdate: null, battery: 0 },
  PALIO2: { lat: -20.3881, lng: -43.7569, lastUpdate: null, battery: 0 }
};
const markers = {};

// ===== MAPA LEAFLET - SATÉLITE =====
const map = L.map('map', {
  zoomControl: true,
  attributionControl: true,
  scrollWheelZoom: true,   // habilita zoom com roda do mouse
  doubleClickZoom: true,   // habilita zoom com duplo clique
  touchZoom: true,         // habilita zoom com pinça no celular
  tap: true                // habilita tap no mobile
}).setView([-20.3881, -43.7569], 14);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
const rua = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
L.control.layers({ "🛰️ Satélite": sat, "🗺️ Rua": rua }).addTo(map);
map.zoomControl.setPosition('topleft');

// ===== STATUS =====
function getStatus(lastUpdate) {
  if (!lastUpdate) return 'OFFLINE';
  const m = (Date.now() - lastUpdate) / 60000;
  if (m <= 5) return 'ONLINE';
  if (m <= 60) return 'SEM_CONEXAO';
  return 'OFFLINE';
}

// ===== MARCADORES =====
function createMarker(carId) {
  const data = carsData[carId];
  const status = getStatus(data.lastUpdate);

  if (markers[carId]) { map.removeLayer(markers[carId]); }

  const icon = L.divIcon({
    className: '',
    html: `<div class="car-pin ${status.toLowerCase()}"><div class="car-label-pin">${CARS[carId].label}</div></div>`,
    iconSize: [26, 26],
    iconAnchor: [13, 13]
  });

  markers[carId] = L.marker([data.lat, data.lng], { icon }).addTo(map);
  markers[carId].bindPopup(`<b>${CARS[carId].label}</b><br>${new Date(data.lastUpdate || Date.now()).toLocaleString('pt-BR')}`);
}

// ===== SELEÇÃO DE CARRO =====
function selectCar(carId) {
  currentCar = carId;
  document.querySelectorAll('.car-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + (carId === 'PALIO1' ? 'palio1' : 'palio2')).classList.add('active');
  updateUI();
  goToCar();
}

// ===== BUSCAR DADOS SUPABASE =====
async function fetchCarData(device_id) {
  try {
    const r = await fetch(`${U}/rest/v1/rastreador?device_id=eq.${device_id}&order=updated_at.desc&limit=1`, {
      headers: { apikey: K, Authorization: "Bearer " + K }
    });
    if (!r.ok) return null;
    const d = await r.json();
    if (d[0]) {
      return {
        lat: d[0].lat,
        lng: d[0].lng,
        lastUpdate: new Date(d[0].updated_at).getTime(),
        battery: d[0].battery || (status === 'ONLINE' ? 85 : 0)
      };
    }
  } catch (e) {}
  return null;
}

async function refreshData() {
  for (const carId of Object.keys(CARS)) {
    const data = await fetchCarData(CARS[carId].device_id);
    if (data) {
      carsData[carId] = data;
      createMarker(carId);
    } else {
      // Sem dados na tabela → marca como OFFLINE mas mantém marker
      createMarker(carId);
    }
  }
  updateUI();
}

// ===== FORMATAÇÃO =====
function formatTimeAgo(ms) {
  if (!ms) return '--';
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 0) return 'agora';
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}min`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}min`;
}

// ===== ATUALIZAR UI =====
function updateUI() {
  const data = carsData[currentCar];
  const status = getStatus(data.lastUpdate);

  // Status grande
  const statusBig = document.getElementById('status-big');
  statusBig.className = status.toLowerCase();
  const statusText = { ONLINE: 'ONLINE', SEM_CONEXAO: 'SEM CONEXÃO', OFFLINE: 'OFFLINE' };
  const statusSub = {
    ONLINE: 'Atualizado agora',
    SEM_CONEXAO: 'Visto há ' + formatTimeAgo(data.lastUpdate),
    OFFLINE: 'Sem conexão'
  };
  statusBig.innerText = statusText[status];
  document.getElementById('status-sub').innerText = statusSub[status];
  document.getElementById('car-label').innerText = CARS[currentCar].label;

  // Atualiza bolinhas dos botões (todos os carros)
  for (const carId of Object.keys(CARS)) {
    const s = getStatus(carsData[carId].lastUpdate);
    const dot = document.getElementById('dot-' + carId);
    dot.className = 'dot ' + s.toLowerCase();
  }

  // Ícones do card
  let signal;
  if (status === 'ONLINE') signal = '4/4';
  else if (status === 'SEM_CONEXAO') signal = '2/4';
  else signal = '0/4';
  document.getElementById('signal-val').innerText = signal;

  // Bateria (se não vier do Supabase, simula baseado no status)
  let battery = data.battery || 0;
  if (!battery) {
    battery = status === 'ONLINE' ? 85 : status === 'SEM_CONEXAO' ? 45 : 0;
  }
  document.getElementById('battery-val').innerText = battery + '%';

  // Atualizado há
  document.getElementById('updated-val').innerText = formatTimeAgo(data.lastUpdate);

  // Botão de ação
  const btn = document.getElementById('action-btn');
  const btnText = document.getElementById('action-btn-text');
  if (status === 'ONLINE') {
    btn.className = 'online';
    btnText.innerText = 'VOLTAR AO CARRO';
  } else if (status === 'SEM_CONEXAO') {
    btn.className = 'semconexao';
    btnText.innerText = 'VER ÚLTIMO LOCAL';
  } else {
    btn.className = 'offline';
    btnText.innerText = 'VER ÚLTIMO LOCAL';
  }
}

// ===== AÇÃO DO BOTÃO =====
function goToCar() {
  const data = carsData[currentCar];
  const currentZoom = map.getZoom();
  const targetZoom = 18;

  // Força o zoom: se já está em zoom alto, só centraliza; senão faz flyTo com zoom
  if (currentZoom >= 17) {
    // Já está perto - só pan
    map.panTo([data.lat, data.lng], { animate: true, duration: 1.0 });
  } else {
    // Está longe - faz flyTo com zoom forte
    map.flyTo([data.lat, data.lng], targetZoom, { animate: true, duration: 1.5 });
  }
  
  // Abre popup do marker correspondente
  if (markers[currentCar]) {
    setTimeout(() => markers[currentCar].openPopup(), 1600);
  }
}

// ===== INTERVALOS =====
// Atualiza "Atualizado há" a cada 10s (sozinho)
setInterval(updateUI, 10000);
// Busca dados no Supabase a cada 15s
setInterval(refreshData, 15000);

// Inicializa
refreshData();
</script>
</body>
</html>
